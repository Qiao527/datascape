<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>PSR B1919+21 · Datascape</title>
    <meta name="description" content="A tribute to the famous pulsar plot: the spectrum of your music becomes white 3D ridges flowing into the distance." />
  </head>
  <body>
    <main>
      <div class="stage" id="stage"></div>

      <header class="title">
        <p class="title-name">PSR B1919+21</p>
        <p class="title-sub" id="source">No sound yet · playing the pulsar signal</p>
      </header>

      <nav class="controls" aria-label="Sound source">
        <button type="button" id="demo" aria-pressed="false">Demo</button>
        <label class="file-button">
          Upload music
          <input type="file" id="file" accept="audio/*" />
        </label>
        <button type="button" id="mic" aria-pressed="false">Microphone</button>
        <button type="button" id="pause" hidden>Pause</button>
        <button type="button" id="stop" hidden>Stop</button>
        <label class="sensitivity">
          <span>Sensitivity</span>
          <input type="range" id="sensitivity" min="0.4" max="2.2" step="0.05" value="1" />
        </label>
      </nav>

      <p class="status" id="status" role="status" hidden></p>
      <p class="hint">Drag to rotate · scroll to zoom · double-click for the cover view · space to pause · drop an audio file onto the page</p>
      <div class="drop" id="drop" hidden><p>Release to play</p></div>
      <a class="back-link" href="/">← Datascape</a>
    </main>

    <script type="module" src="/src/pulsar/main.js"></script>
  </body>
</html>
