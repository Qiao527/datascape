<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Commit City · Datascape</title>
    <meta name="description" content="Type a GitHub username and a year of its contribution calendar rises as a 3D city at night, or a glowing terrain." />
  </head>
  <body>
    <main>
      <div class="stage" id="stage"></div>

      <aside class="panel">
        <p class="panel-eyebrow">COMMIT CITY</p>
        <h1>A year of commits, as a city</h1>

        <form id="search" class="search" autocomplete="off">
          <label class="visually-hidden" for="user">GitHub username</label>
          <input id="user" name="user" placeholder="GitHub username" spellcheck="false" required maxlength="40" />
          <label class="visually-hidden" for="year">Period</label>
          <select id="year" name="year"></select>
          <button type="submit">Build</button>
        </form>

        <p class="status" id="status" role="status" hidden></p>
        <dl class="stats" id="stats" hidden></dl>

        <div class="panel-actions">
          <div class="mode-switch" role="group" aria-label="View">
            <button type="button" data-mode="city" aria-pressed="true">City</button>
            <button type="button" data-mode="terrain" aria-pressed="false">Terrain</button>
          </div>
          <button type="button" class="ghost-button" id="snapshot">Save image</button>
        </div>
      </aside>

      <div class="tooltip" id="tooltip" hidden><strong></strong><span></span></div>
      <p class="hint">Drag to rotate · scroll to zoom · double-click to reset the view</p>
      <a class="back-link" href="/">← Datascape</a>
    </main>

    <script type="module" src="/src/skyline/main.js"></script>
  </body>
</html>
