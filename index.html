<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Datascape · 把 2D 图表变成 3D 场景</title>
    <meta name="description" content="把熟悉的 2D 图表变成可以走进去的 3D 场景：GitHub 贡献之城与音乐驱动的脉冲星山脊。" />
    <link rel="stylesheet" href="/src/shared/base.css" />
    <link rel="stylesheet" href="/src/home.css" />
  </head>
  <body>
    <main class="home">
      <header class="home-header">
        <p class="eyebrow">DATASCAPE</p>
        <h1>把 2D 图表<br />变成 3D 场景</h1>
        <p class="lede">每个作品都从一张熟悉的平面图出发，把数据变成可以绕着看、可以互动的空间。</p>
      </header>

      <section class="cards">
        <a class="card card-skyline" href="/skyline.html">
          <div class="card-art" aria-hidden="true">
            <span style="--h: 30%"></span><span style="--h: 62%"></span><span style="--h: 44%"></span>
            <span style="--h: 88%"></span><span style="--h: 20%"></span><span style="--h: 70%"></span>
            <span style="--h: 52%"></span><span style="--h: 36%"></span><span style="--h: 78%"></span>
            <span style="--h: 26%"></span><span style="--h: 58%"></span><span style="--h: 40%"></span>
          </div>
          <div class="card-body">
            <p class="card-from">GitHub 贡献日历 → 夜晚的城市</p>
            <h2>Commit City</h2>
            <p>输入任意 GitHub 用户名，一年的提交记录拔地而起，每一天是一栋亮着灯的楼。</p>
          </div>
        </a>

        <a class="card card-pulsar" href="/pulsar.html">
          <svg class="card-art card-art-lines" viewBox="0 0 200 120" aria-hidden="true">
            <path d="M0 52 L74 52 Q82 50 88 40 T98 24 T108 38 T118 30 T128 52 L200 52" />
            <path d="M0 64 L76 64 Q84 62 90 50 T100 30 T110 48 T120 40 T130 64 L200 64" />
            <path d="M0 76 L72 76 Q80 74 86 60 T96 44 T104 62 T114 50 T124 76 L200 76" />
            <path d="M0 88 L75 88 Q82 86 88 70 T98 50 T108 72 T118 64 T128 88 L200 88" />
            <path d="M0 100 L70 100 Q80 98 85 80 T95 60 T105 85 T115 70 T125 100 L200 100" />
          </svg>
          <div class="card-body">
            <p class="card-from">脉冲星堆叠折线图 → 会随音乐起伏的山脊</p>
            <h2>PSR B1919+21</h2>
            <p>向那张著名唱片封面致敬：上传一首歌或打开麦克风，频谱化作一道道向远方流去的白色山脊。</p>
          </div>
        </a>
      </section>
    </main>
  </body>
</html>
